<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>스피닝 & 리스닝 마스터 (백그라운드 재생)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Jua&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Jua', 'Fredoka', cursive, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%) !important;
      min-height: 100vh;
    }
    .font-eng {
      font-family: 'Fredoka', cursive, sans-serif;
    }
    .sentence-btn {
      transition: all 0.1s ease;
      background-color: #2c3e50 !important;
      color: #ffffff !important;
      border-radius: 8px !important;
      text-align: left !important;
      padding: 12px 14px !important;
      word-break: keep-all !important;
      white-space: pre-line !important;
    }
    .sentence-btn:hover {
      color: #f1c40f !important;
    }
    .energy-btn {
      background-color: #ffffff !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 8px !important;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      padding: 6px 10px;
      line-height: 1.2;
      transition: background 0.1s;
    }
    .energy-btn:hover {
      background-color: #f1f5f9 !important;
    }
  </style>
</head>
<body class="flex flex-col text-slate-800 p-2 sm:p-4 md:p-6 max-w-4xl mx-auto pb-32">

  <!-- 상단 모드 전환 탭 -->
  <div class="flex items-center justify-center gap-3 bg-white p-2 rounded-2xl shadow-sm border border-slate-200 mb-4">
    <button id="modeSpeakingBtn" onclick="switchMode('speaking')" class="flex-1 py-2.5 rounded-xl font-bold text-base sm:text-lg bg-[#2c3e50] text-white shadow transition">
      🗣️ 스피킹 마스터
    </button>
    <button id="modeListeningBtn" onclick="switchMode('listening')" class="flex-1 py-2.5 rounded-xl font-bold text-base sm:text-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition">
      🎧 리스닝 마스터
    </button>
  </div>

  <!-- ========================================== -->
  <!-- 🗣️ [모드 1] 스피킹 마스터 영역                 -->
  <!-- ========================================== -->
  <div id="speakingSection" class="flex flex-col gap-3">
    
    <!-- 타이틀 및 시트 선택 -->
    <div class="bg-white rounded-3xl p-4 sm:p-6 shadow-sm border border-slate-200 flex flex-col gap-3">
      <h1 id="speakingTitle" class="text-2xl sm:text-3xl font-black text-slate-800 text-center">👑 스피킹 마스터 👑</h1>
      
      <div>
        <label class="text-xs font-bold text-slate-500 mb-1 block">학습 시트 선택</label>
        <select id="sheetSelect" onchange="changeSheet()" class="w-full p-2.5 rounded-xl border border-slate-300 font-bold bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-500">
          <option value="">시트 목록 불러오는 중...</option>
        </select>
      </div>

      <!-- 슬라이더 조절바 (글자 크기 & 속도) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2 border-t border-slate-100">
        <div>
          <div class="flex justify-between text-xs font-bold text-slate-600 mb-1">
            <span>🔤 문장 글자 크기 조절</span>
            <span id="fontSizeVal">26px</span>
          </div>
          <input type="range" id="fontSizeSlider" min="26" max="50" value="26" class="w-full accent-slate-700" oninput="changeFontSize(this.value)">
        </div>
        <div>
          <div class="flex justify-between text-xs font-bold text-slate-600 mb-1">
            <span>⚡ 문장 재생 속도 조절</span>
            <span id="speedVal">1.0배속</span>
          </div>
          <input type="range" id="speedSlider" min="0.6" max="1.3" step="0.05" value="1.0" class="w-full accent-slate-700" oninput="changeSpeed(this.value)">
        </div>
      </div>
    </div>

    <!-- 단계별 일괄 반복 재생 버튼들 -->
    <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200 flex flex-col gap-2">
      <button onclick="playRelay('all')" class="p-3 bg-[#f0fdf4] border-2 border-[#2ecc71] rounded-xl text-[#15803d] font-black text-sm sm:text-base text-center shadow-sm hover:bg-emerald-100 transition">
        📻 🔁 🟥🟧🟨🟩 전체 문장 연속 반복 재생
      </button>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <button onclick="playRelay('0')" class="p-2.5 bg-[#fef2f2] border-2 border-[#ef4444] rounded-xl text-[#b91c1c] font-black text-xs text-center shadow-sm hover:bg-rose-100 transition">
          📻 🔁 🟥 4단계
        </button>
        <button onclick="playRelay('1')" class="p-2.5 bg-[#fff7ed] border-2 border-[#f97316] rounded-xl text-[#c2410c] font-black text-xs text-center shadow-sm hover:bg-orange-100 transition">
          📻 🔁 🟧 3단계
        </button>
        <button onclick="playRelay('2')" class="p-2.5 bg-[#fefce8] border-2 border-[#eab308] rounded-xl text-[#a16207] font-black text-xs text-center shadow-sm hover:bg-yellow-100 transition">
          📻 🔁 🟨 2단계
        </button>
        <button onclick="playRelay('3')" class="p-2.5 bg-[#f0fdf4] border-2 border-[#22c55e] rounded-xl text-[#15803d] font-black text-xs text-center shadow-sm hover:bg-emerald-100 transition">
          📻 🔁 🟩 1단계
        </button>
      </div>
      
      <div class="mt-2">
        <label class="text-xs font-bold text-slate-500 mb-1 block">🎯 학습할 단계 선택</label>
        <select id="stageFilterSelect" onchange="renderSentenceList()" class="w-full p-2.5 rounded-xl border border-slate-300 font-bold bg-slate-50 text-slate-800">
          <option value="all">🟥🟧🟨🟩 전체 보기</option>
          <option value="0">🟥 4단계만 보기</option>
          <option value="1">🟧 3단계만 보기</option>
          <option value="2">🟨 2단계만 보기</option>
          <option value="3">🟩 1단계만 보기</option>
        </select>
      </div>
    </div>

    <!-- 문장 리스트 출력 영역 -->
    <div id="sentenceContainer" class="flex flex-col gap-2.5">
      <div class="text-center py-10 text-slate-400">구글 시트에서 문장 불러오는 중...</div>
    </div>

  </div>

  <!-- 하단 고정 오디오 플레이어 바 (백그라운드 유지용) -->
  <div id="persistentPlayerBar" class="fixed bottom-0 left-0 right-0 bg-slate-900 text-white p-3 shadow-lg border-t border-slate-700 max-w-4xl mx-auto z-50 flex flex-col gap-2" style="display: none;">
    <div class="flex items-center justify-between text-xs">
      <span id="playerStatusText" class="font-bold text-emerald-400">▶ 대기 중</span>
      <button onclick="stopAudioEngine()" class="px-2.5 py-1 bg-rose-600 font-bold rounded-lg text-white">끄기</button>
    </div>
    <audio id="mainAudioPlayer" controls class="w-full h-10 accent-emerald-500"></audio>
    <div class="flex gap-2">
      <button onclick="seekAudio(-5)" class="flex-1 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-lg border border-slate-600">⏪ 5초 뒤로</button>
      <button onclick="toggleJjikJjik()" id="jjikBtn" class="flex-1 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-xs font-bold rounded-lg">🔁 3초 찍찍이</button>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzkkXhkTBKb5-PSYHbU2S68M4gxNzXrXaq1RCCRJIjHtFtoOZmfwEH_vK_srz2WVWvmkQ/exec";

    let currentSheetName = '';
    let cachedSheetsData = {};
    let currentFontSize = 26;
    let currentSpeed = 1.0;
    
    let audioQueue = [];
    let audioQueueIdx = 0;
    let isJjikActive = false;
    let jjikTimer = null;

    const audioPlayer = document.getElementById('mainAudioPlayer');
    const playerBar = document.getElementById('persistentPlayerBar');

    window.addEventListener('DOMContentLoaded', () => {
      initSpeakingMaster();
      audioPlayer.onended = handleAudioEnded;
    });

    function changeFontSize(val) {
      currentFontSize = val;
      document.getElementById('fontSizeVal').textContent = val + 'px';
      document.querySelectorAll('.sentence-btn').forEach(btn => btn.style.fontSize = val + 'px');
    }

    function changeSpeed(val) {
      currentSpeed = parseFloat(val);
      document.getElementById('speedVal').textContent = val + '배속';
      audioPlayer.playbackRate = currentSpeed;
    }

    async function initSpeakingMaster() {
      try {
        const res = await fetch(`${GAS_URL}?action=getSheets`);
        const sheetNames = await res.json();
        const select = document.getElementById('sheetSelect');
        select.innerHTML = '';
        
        sheetNames.forEach((name) => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          select.appendChild(opt);
        });

        if (sheetNames.length > 0) {
          currentSheetName = sheetNames[0];
          document.getElementById('speakingTitle').textContent = `👑 ${currentSheetName} 스피킹 마스터 👑`;
          loadSheetContent(currentSheetName);
        }
      } catch (err) {
        document.getElementById('sentenceContainer').innerHTML = `<div class="text-center py-10 text-rose-500 font-bold">시트 목록 로드 실패</div>`;
      }
    }

    function changeSheet() {
      stopAudioEngine();
      const select = document.getElementById('sheetSelect');
      currentSheetName = select.value;
      document.getElementById('speakingTitle').textContent = `👑 ${currentSheetName} 스피킹 마스터 👑`;
      loadSheetContent(currentSheetName);
    }

    async function loadSheetContent(sheetName) {
      const cached = localStorage.getItem(`sheet_cache_${sheetName}`);
      if (cached) {
        cachedSheetsData[sheetName] = JSON.parse(cached);
        renderSentenceList();
        return;
      }

      document.getElementById('sentenceContainer').innerHTML = `<div class="text-center py-10 text-slate-400">데이터 로딩 중...</div>`;

      try {
        const res = await fetch(`${GAS_URL}?action=getData&sheet=${encodeURIComponent(sheetName)}`);
        const rows = await res.json();
        cachedSheetsData[sheetName] = rows;
        localStorage.setItem(`sheet_cache_${sheetName}`, JSON.stringify(rows));
        renderSentenceList();
      } catch (err) {
        document.getElementById('sentenceContainer').innerHTML = `<div class="text-center py-10 text-rose-500 font-bold">데이터 로딩 오류</div>`;
      }
    }

    function renderSentenceList() {
      const container = document.getElementById('sentenceContainer');
      container.innerHTML = '';

      const rows = cachedSheetsData[currentSheetName] || [];
      const filterStage = document.getElementById('stageFilterSelect').value;

      const filtered = rows.filter(item => filterStage === 'all' || Number(item.energy) === Number(filterStage));

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-slate-400">등록된 문장이 없습니다.</div>`;
        return;
      }

      filtered.forEach((item) => {
        const rowDiv = document.createElement('div');
        rowDiv.className = "flex items-center gap-2 bg-white p-2.5 sm:p-3 rounded-2xl shadow-sm border border-slate-200";

        const leftCol = document.createElement('div');
        leftCol.className = "flex-1 min-w-0";
        
        const sentenceBtn = document.createElement('button');
        sentenceBtn.className = "sentence-btn w-full font-black";
        sentenceBtn.style.fontSize = currentFontSize + 'px';
        sentenceBtn.innerHTML = `${item.id}.<br>${item.kr}`;
        sentenceBtn.dataset.state = 'kr';
        sentenceBtn.dataset.kr = `${item.id}.\n${item.kr}`;
        sentenceBtn.dataset.en = `${item.id}.\n${item.en}`;

        leftCol.appendChild(sentenceBtn);

        const rightCol = document.createElement('div');
        rightCol.className = "w-14 shrink-0 flex items-center justify-end";

        const energyBtn = document.createElement('button');
        energyBtn.className = "energy-btn w-full text-xs font-black p-1.5";
        energyBtn.innerHTML = getEnergyBlockText(Number(item.energy));
        
        energyBtn.onclick = () => {
          item.energy = Number(item.energy) < 3 ? Number(item.energy) + 1 : 0;
          energyBtn.innerHTML = getEnergyBlockText(item.energy);
          localStorage.setItem(`sheet_cache_${currentSheetName}`, JSON.stringify(rows));

          fetch(GAS_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sheet: currentSheetName, rowIndex: item.rowIndex, energy: item.energy })
          }).catch(e => {});
        };

        const playBtn = document.createElement('button');
        playBtn.className = "w-full py-4 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl font-black text-sm shadow-sm transition flex items-center justify-center";
        playBtn.innerHTML = "▶";
        playBtn.onclick = (e) => {
          e.stopPropagation();
          playSingleSentence(item.en);
        };

        rightCol.appendChild(energyBtn);

        sentenceBtn.onclick = () => {
          if (sentenceBtn.dataset.state === 'kr') {
            sentenceBtn.innerText = sentenceBtn.dataset.en;
            sentenceBtn.dataset.state = 'en';
            rightCol.innerHTML = '';
            rightCol.appendChild(playBtn);
          } else {
            sentenceBtn.innerText = sentenceBtn.dataset.kr;
            sentenceBtn.dataset.state = 'kr';
            rightCol.innerHTML = '';
            rightCol.appendChild(energyBtn);
          }
        };

        rowDiv.appendChild(leftCol);
        rowDiv.appendChild(rightCol);
        container.appendChild(rowDiv);
      });
    }

    function playSingleSentence(text) {
      audioQueue = [text];
      audioQueueIdx = 0;
      isJjikActive = true; // 개별 재생은 기본적으로 찍찍이(반복) 활성화
      document.getElementById('jjikBtn').className = "flex-1 py-1.5 bg-emerald-600 text-xs font-bold rounded-lg";
      document.getElementById('jjikBtn').textContent = "🔁 3초 찍찍이 (ON)";
      playQueueAudio();
    }

    function playRelay(level) {
      const filterSelect = document.getElementById('stageFilterSelect');
      if (filterSelect) {
        filterSelect.value = level;
        renderSentenceList();
      }

      const rows = cachedSheetsData[currentSheetName] || [];
      const targetRows = level === 'all' ? rows : rows.filter(item => Number(item.energy) === Number(level));
      
      if (targetRows.length === 0) {
        alert("재생할 문장이 없습니다!");
        return;
      }

      audioQueue = targetRows.map(r => r.en);
      audioQueueIdx = 0;
      isJjikActive = false; // 전체 연속 재생은 순차 진행
      document.getElementById('jjikBtn').className = "flex-1 py-1.5 bg-indigo-600 text-xs font-bold rounded-lg";
      document.getElementById('jjikBtn').textContent = "🔁 3초 찍찍이 (OFF)";
      playQueueAudio();
    }

    function playQueueAudio() {
      if (audioQueueIdx >= audioQueue.length) {
        audioQueueIdx = 0; // 전체 반복
      }

      const text = audioQueue[audioQueueIdx];
      const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=en&client=tw-ob`;

      playerBar.style.display = 'flex';
      document.getElementById('playerStatusText').textContent = `▶ 재생 중 (${audioQueueIdx + 1}/${audioQueue.length})`;
      
      audioPlayer.src = ttsUrl;
      audioPlayer.playbackRate = currentSpeed;
      audioPlayer.play().catch(e => {
        console.log("Audio play blocked or error:", e);
      });
    }

    function handleAudioEnded() {
      if (jjikTimer) clearTimeout(jjikTimer);

      if (isJjikActive && audioQueue.length === 1) {
        // 3초 찍찍이 활성화 상태 (0.6초 쉬고 다시 반복)
        jjikTimer = setTimeout(() => {
          audioPlayer.currentTime = 0;
          audioPlayer.play();
        }, 600);
      } else {
        // 다음 문장으로 순차 이동
        audioQueueIdx++;
        jjikTimer = setTimeout(() => {
          playQueueAudio();
        }, 600);
      }
    }

    function toggleJjikJjik() {
      isJjikActive = !isJjikActive;
      const btn = document.getElementById('jjikBtn');
      if (isJjikActive) {
        btn.className = "flex-1 py-1.5 bg-emerald-600 text-xs font-bold rounded-lg";
        btn.textContent = "🔁 3초 찍찍이 (ON)";
      } else {
        btn.className = "flex-1 py-1.5 bg-indigo-600 text-xs font-bold rounded-lg";
        btn.textContent = "🔁 3초 찍찍이 (OFF)";
      }
    }

    function seekAudio(sec) {
      audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime + sec);
    }

    function stopAudioEngine() {
      audioPlayer.pause();
      audioPlayer.src = '';
      playerBar.style.display = 'none';
      if (jjikTimer) clearTimeout(jjikTimer);
    }

    function getEnergyBlockText(energy) {
      if (energy === 0) return "🟥<br>🟥<br>🟥<br>🟥";
      if (energy === 1) return "🟧<br>🟧<br>🟧";
      if (energy === 2) return "🟨<br>🟨";
      return "🟩";
    }

    function loadListeningTracks() {
      const container = document.getElementById('listeningTrackContainer');
      container.innerHTML = `<div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">리스닝 마스터 영역</div>`;
    }
  </script>
</body>
</html>
