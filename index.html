<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>스피킹 마스터</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

  <style>
    :root { --fs: 26px; }

    body {
      font-family: 'Jua', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%) !important;
      min-height: 100vh;
    }
    .sentence-btn {
      transition: all 0.1s ease;
      background-color: #2c3e50 !important;
      color: #ffffff !important;
      border-radius: 8px !important;
      text-align: left !important;
      padding: 12px 14px !important;
      word-break: keep-all !important;
      white-space: pre-line !important;
      font-size: var(--fs);
    }
    .sentence-btn:hover { color: #f1c40f !important; }
    .energy-btn {
      background-color: #ffffff !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 8px !important;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      padding: 6px 10px;
      line-height: 1.2;
      transition: background 0.1s;
    }
    .energy-btn:hover { background-color: #f1f5f9 !important; }

    /* 지금 재생 중인 문장 카드 */
    .playing { box-shadow: 0 0 0 3px #f1c40f; }
  </style>
</head>

<body class="text-slate-800 p-2 sm:p-4 md:p-6 max-w-4xl mx-auto">
  <main class="flex flex-col gap-3">

    <!-- 타이틀 · 시트 선택 · 슬라이더 -->
    <section class="bg-white rounded-3xl p-4 sm:p-6 shadow-sm border border-slate-200 flex flex-col gap-3">
      <h1 id="title" class="text-2xl sm:text-3xl font-black text-slate-800 text-center">👑 스피킹 마스터 👑</h1>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-bold text-slate-500">학습 시트 선택</label>
          <button id="refreshBtn" class="text-xs font-bold text-indigo-600 hover:text-indigo-800 bg-indigo-50 px-2 py-1 rounded-lg transition border border-indigo-100 shadow-sm">
            🔄 최신 시트 불러오기
          </button>
        </div>
        <select id="sheetSelect" class="w-full p-2.5 rounded-xl border border-slate-300 font-bold bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-500">
          <option value="">시트 목록 불러오는 중...</option>
        </select>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2 border-t border-slate-100">
        <div>
          <div class="flex justify-between text-xs font-bold text-slate-600 mb-1">
            <span>🔤 문장 글자 크기 조절</span>
            <span id="fontSizeVal">26px</span>
          </div>
          <input type="range" id="fontSizeSlider" min="26" max="50" value="26" class="w-full accent-slate-700">
        </div>
        <div>
          <div class="flex justify-between text-xs font-bold text-slate-600 mb-1">
            <span>⚡ 문장 재생 속도 조절</span>
            <span id="speedVal">1.0배속</span>
          </div>
          <input type="range" id="speedSlider" min="0.4" max="1.3" step="0.05" value="1.0" class="w-full accent-slate-700">
        </div>
      </div>
    </section>

    <!-- 단계별 연속 재생 · 단계 필터 -->
    <section class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200 flex flex-col gap-2">
      <button data-relay="all" class="p-3 bg-[#f0fdf4] border-2 border-[#2ecc71] rounded-xl text-[#15803d] font-black text-sm sm:text-base text-center shadow-sm hover:bg-emerald-100 transition">
        📻 🔁 🟥🟧🟨🟩 전체 문장 연속 반복 재생
      </button>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <button data-relay="0" class="p-2.5 bg-[#fef2f2] border-2 border-[#ef4444] rounded-xl text-[#b91c1c] font-black text-xs text-center shadow-sm hover:bg-rose-100 transition">📻 🔁 🟥 4단계</button>
        <button data-relay="1" class="p-2.5 bg-[#fff7ed] border-2 border-[#f97316] rounded-xl text-[#c2410c] font-black text-xs text-center shadow-sm hover:bg-orange-100 transition">📻 🔁 🟧 3단계</button>
        <button data-relay="2" class="p-2.5 bg-[#fefce8] border-2 border-[#eab308] rounded-xl text-[#a16207] font-black text-xs text-center shadow-sm hover:bg-yellow-100 transition">📻 🔁 🟨 2단계</button>
        <button data-relay="3" class="p-2.5 bg-[#f0fdf4] border-2 border-[#22c55e] rounded-xl text-[#15803d] font-black text-xs text-center shadow-sm hover:bg-emerald-100 transition">📻 🔁 🟩 1단계</button>
      </div>

      <div class="mt-2">
        <label class="text-xs font-bold text-slate-500 mb-1 block">🎯 학습할 단계 선택</label>
        <select id="stageFilter" class="w-full p-2.5 rounded-xl border border-slate-300 font-bold bg-slate-50 text-slate-800">
          <option value="all">🟥🟧🟨🟩 전체 보기</option>
          <option value="0">🟥 4단계만 보기</option>
          <option value="1">🟧 3단계만 보기</option>
          <option value="2">🟨 2단계만 보기</option>
          <option value="3">🟩 1단계만 보기</option>
        </select>
      </div>
    </section>

    <!-- 연속 재생 중에만 나타나는 바 (스크롤해도 따라다님) -->
    <div id="relayBar" class="sticky top-2 z-10"></div>

    <!-- 문장 목록 -->
    <div id="sentenceContainer" class="flex flex-col gap-2.5"></div>

  </main>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzkkXhkTBKb5-PSYHbU2S68M4gxNzXrXaq1RCCRJIjHtFtoOZmfwEH_vK_srz2WVWvmkQ/exec";
    const ENERGY_BLOCKS = ["🟥<br>🟥<br>🟥<br>🟥", "🟧<br>🟧<br>🟧", "🟨<br>🟨", "🟩"];

    const $ = (id) => document.getElementById(id);
    const cacheKey = (sheet) => `sheet_cache_${sheet}`;

    const state = { sheet: '', data: {} };
    const cards = new Map();   // 문장(item) -> { row, playBtn }
    let relayList = null;      // 연속 재생 중인 문장 목록 (단일 재생이면 null)

    /* =========================================================
       음성 재생 엔진
       - 단일 반복 / 연속 반복을 하나의 큐로 처리
       - session 번호로 "이미 취소된 재생"의 콜백을 무시
       - 사용자 터치 직후 speak()는 지연 없이 동기 호출 (iOS 제스처 정책)
       ========================================================= */
    const audio = (() => {
      const synth = window.speechSynthesis;
      const GAP_MS = 600;
      let session = 0, timer = null, list = [], idx = 0, playingIdx = 0;
      let playing = null, utter = null, listener = () => {}, errorListener = () => {};

      // 진행 중인 재생·타이머를 모두 무효화
      function halt() {
        session++;
        clearTimeout(timer);
        timer = null;
        if (synth.speaking || synth.pending) synth.cancel();
      }

      function speakCurrent() {
        const s = session;
        const item = list[idx];
        playing = item;
        playingIdx = idx;
        listener(item);

        const u = new SpeechSynthesisUtterance(item.en);
        u.lang = 'en-US';
        u.rate = api.rate;
        const next = () => {
          if (s !== session) return;
          idx = (idx + 1) % list.length;
          timer = setTimeout(() => { if (s === session) speakCurrent(); }, GAP_MS);
        };
        u.onend = next;
        u.onerror = (e) => {
          if (s !== session) return; // 우리가 취소한 경우
          const code = e && e.error;
          if (code === 'interrupted' || code === 'canceled') { next(); return; }
          api.stop();                // 그 외 오류는 멈추고 화면에 알림 (무한 오류 루프 방지)
          errorListener(code || 'unknown');
        };

        utter = u; // 가비지 컬렉션으로 onend가 사라지는 브라우저 버그 방지
        synth.speak(u);
      }

      const api = {
        rate: 1.0,
        current: () => playing,
        onChange: (fn) => { listener = fn; },
        onError: (fn) => { errorListener = fn; },

        play(items) {
          if (!synth) { alert('이 브라우저는 음성 재생을 지원하지 않아요.'); return; }
          halt();
          list = items;
          idx = 0;
          speakCurrent();
        },
        stop() {
          if (!synth) return;
          halt();
          list = [];
          playing = null;
          utter = null;
          listener(null);
        },
        // 지금 읽는 문장 기준으로 delta만큼 이동해서 처음부터 재생 (-1 이전, 0 다시, +1 다음)
        jump(delta) {
          if (!synth || !playing) return;
          halt();
          idx = (playingIdx + delta + list.length) % list.length;
          speakCurrent();
        },
        // 속도를 바꿨을 때 지금 문장을 새 속도로 다시 재생
        restart() { api.jump(0); },
      };
      return api;
    })();

    /* =========================================================
       재생 상태 → 화면 반영
       ========================================================= */
    function syncPlaybackUI(item) {
      if (!item) relayList = null;

      cards.forEach((card, it) => {
        const on = it === item;
        card.row.classList.toggle('playing', on);
        card.playBtn.textContent = on ? '⏹' : '▶';
      });

      const bar = $('relayBar');
      if (relayList) {
        const n = relayList.indexOf(item) + 1;
        bar.innerHTML = `
          <div class="bg-emerald-50 border-2 border-emerald-500 p-2.5 rounded-2xl flex items-center justify-between gap-2 shadow-md">
            <div class="font-bold text-emerald-800 text-sm leading-tight">▶ 연속 재생 중<br>(${n} / ${relayList.length})</div>
            <div class="flex gap-1.5">
              <button data-jump="-1" aria-label="이전 문장" class="w-11 h-11 bg-white border border-emerald-300 text-emerald-800 font-black rounded-xl text-lg active:bg-emerald-100">◀</button>
              <button data-jump="0" aria-label="현재 문장 다시" class="w-11 h-11 bg-white border border-emerald-300 text-emerald-800 font-black rounded-xl text-lg active:bg-emerald-100">🔁</button>
              <button data-jump="1" aria-label="다음 문장" class="w-11 h-11 bg-white border border-emerald-300 text-emerald-800 font-black rounded-xl text-lg active:bg-emerald-100">▶</button>
              <button data-stop aria-label="정지" class="w-11 h-11 bg-rose-600 text-white font-black rounded-xl text-lg">⏹</button>
            </div>
          </div>`;
        cards.get(item)?.row.scrollIntoView({ block: 'center', behavior: 'smooth' });
      } else {
        bar.innerHTML = '';
      }
    }
    audio.onChange(syncPlaybackUI);
    audio.onError((code) => {
      const bar = $('relayBar');
      bar.innerHTML = `<div class="bg-rose-50 border-2 border-rose-400 p-3 rounded-2xl text-rose-700 font-bold text-sm shadow-md">음성 재생 오류: ${code}</div>`;
      setTimeout(() => { if (!relayList) bar.innerHTML = ''; }, 6000);
    });

    function playSingle(item) {
      relayList = null;
      audio.play([item]);
    }

    function playRelay(level) {
      const list = filterRows(state.data[state.sheet] || [], level);
      if (list.length === 0) { alert('재생할 문장이 없습니다!'); return; }

      audio.stop();
      $('stageFilter').value = level;
      renderSentenceList();

      relayList = list;
      audio.play(list);
    }

    /* =========================================================
       시트 데이터
       ========================================================= */
    const normEnergy = (v) => {
      const n = Number(v);
      return Number.isInteger(n) && n >= 0 && n <= 3 ? n : 0;
    };
    const normalizeRows = (rows) => rows.map((r) => ({ ...r, energy: normEnergy(r.energy) }));
    const filterRows = (rows, stage) => (stage === 'all' ? rows : rows.filter((r) => r.energy === Number(stage)));

    async function fetchJson(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      return res.json();
    }

    function readCache(sheet) {
      try {
        const raw = localStorage.getItem(cacheKey(sheet));
        return raw ? normalizeRows(JSON.parse(raw)) : null;
      } catch (e) { return null; }
    }
    function writeCache(sheet, rows) {
      try { localStorage.setItem(cacheKey(sheet), JSON.stringify(rows)); } catch (e) {}
    }

    function showMessage(text, isError = false) {
      cards.clear();
      const div = document.createElement('div');
      div.className = `text-center py-10 ${isError ? 'text-rose-500 font-bold' : 'text-slate-400'}`;
      div.textContent = text;
      $('sentenceContainer').replaceChildren(div);
    }

    async function loadSheet(name, force = false) {
      if (force) localStorage.removeItem(cacheKey(name));

      const cached = readCache(name);
      if (cached) {
        state.data[name] = cached;
        renderSentenceList();
        return;
      }

      showMessage('구글 시트 데이터 로딩 중...');
      try {
        const rows = normalizeRows(await fetchJson(`${GAS_URL}?action=getData&sheet=${encodeURIComponent(name)}`));
        state.data[name] = rows;
        writeCache(name, rows);
        if (name === state.sheet) renderSentenceList(); // 로딩 중 다른 시트로 바꿨다면 무시
      } catch (e) {
        if (name === state.sheet) showMessage('데이터를 불러오는 중 오류가 발생했습니다.', true);
      }
    }

    function selectSheet(name) {
      audio.stop();
      state.sheet = name;
      $('sheetSelect').value = name;
      $('title').textContent = `👑 ${name} 스피킹 마스터 👑`;
      loadSheet(name);
    }

    async function init() {
      showMessage('구글 시트에서 문장 불러오는 중...');
      try {
        const names = await fetchJson(`${GAS_URL}?action=getSheets`);
        const select = $('sheetSelect');
        select.replaceChildren(...names.map((n) => new Option(n, n)));
        if (names.length > 0) selectSheet(names[0]);
      } catch (e) {
        showMessage('시트 목록을 불러오는 데 실패했습니다.', true);
      }
    }

    /* =========================================================
       문장 목록 화면
       ========================================================= */
    function renderSentenceList() {
      const rows = state.data[state.sheet] || [];
      const list = filterRows(rows, $('stageFilter').value);

      if (list.length === 0) {
        showMessage('해당 단계에 등록된 문장이 없습니다.');
        return;
      }

      cards.clear();
      $('sentenceContainer').replaceChildren(...list.map((item) => createCard(item, rows)));
      syncPlaybackUI(audio.current()); // 재생 중이면 표시 유지
    }

    function createCard(item, rows) {
      const sheet = state.sheet;

      const row = document.createElement('div');
      row.className = 'flex items-center gap-2 bg-white p-2.5 sm:p-3 rounded-2xl shadow-sm border border-slate-200';

      const left = document.createElement('div');
      left.className = 'flex-1 min-w-0';
      const sentenceBtn = document.createElement('button');
      sentenceBtn.className = 'sentence-btn w-full font-black';
      left.appendChild(sentenceBtn);

      const right = document.createElement('div');
      right.className = 'w-14 shrink-0 flex items-center justify-end';

      // 단계 변경 버튼 (한글 보기 상태)
      const energyBtn = document.createElement('button');
      energyBtn.className = 'energy-btn w-full text-xs font-black p-1.5';
      energyBtn.innerHTML = ENERGY_BLOCKS[item.energy];
      energyBtn.onclick = () => {
        item.energy = (item.energy + 1) % 4;
        energyBtn.innerHTML = ENERGY_BLOCKS[item.energy];
        writeCache(sheet, rows);
        fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify({ sheet, rowIndex: item.rowIndex, energy: item.energy }),
        }).catch(() => {});
      };

      // 재생/정지 버튼 (영어 보기 상태)
      const playBtn = document.createElement('button');
      playBtn.className = 'w-full py-4 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl font-black text-sm shadow-sm transition flex items-center justify-center';
      playBtn.textContent = '▶';
      playBtn.onclick = (e) => {
        e.stopPropagation();
        if (audio.current() === item) audio.stop();
        else playSingle(item);
      };

      let showingEn = false;
      const show = (en) => {
        showingEn = en;
        sentenceBtn.textContent = `${item.id}.\n${en ? item.en : item.kr}`;
        right.replaceChildren(en ? playBtn : energyBtn);
      };
      sentenceBtn.onclick = () => {
        // 영어 → 한글로 돌아갈 때, 이 카드의 문장이 재생 중일 때만 멈춤
        if (showingEn && audio.current() === item) audio.stop();
        show(!showingEn);
      };
      show(false);

      row.append(left, right);
      cards.set(item, { row, playBtn });
      return row;
    }

    /* =========================================================
       이벤트 연결
       ========================================================= */
    $('sheetSelect').addEventListener('change', (e) => selectSheet(e.target.value));
    $('refreshBtn').addEventListener('click', () => {
      if (!state.sheet) return;
      audio.stop();
      loadSheet(state.sheet, true);
    });
    $('stageFilter').addEventListener('change', () => {
      audio.stop();
      renderSentenceList();
    });

    document.querySelectorAll('[data-relay]').forEach((btn) => {
      btn.addEventListener('click', () => playRelay(btn.dataset.relay));
    });
    $('relayBar').addEventListener('click', (e) => {
      if (e.target.closest('[data-stop]')) { audio.stop(); return; }
      const jumpBtn = e.target.closest('[data-jump]');
      if (jumpBtn) audio.jump(Number(jumpBtn.dataset.jump));
    });

    $('fontSizeSlider').addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--fs', `${e.target.value}px`);
      $('fontSizeVal').textContent = `${e.target.value}px`;
    });
    $('speedSlider').addEventListener('input', (e) => {
      audio.rate = parseFloat(e.target.value);
      $('speedVal').textContent = `${audio.rate}배속`;
    });
    $('speedSlider').addEventListener('change', () => audio.restart()); // 손을 뗐을 때 새 속도로 재생

    init();
  </script>
</body>
</html>
